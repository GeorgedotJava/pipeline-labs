name: "Estrutura de diretórios e arquivos"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  demonstrando-estrutura:
    name: "Demonstrar estrutura básica"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Mostrar estrutura .github/workflows
        run: |
          echo "== Estrutura de diretorios e arquivos .github/worflows == "
          ls -la .github/workflows
          echo ""
          echo " Total de workflows: $(ls -l .github/worflows | wc -l) "

      - name: Elementos obrigatórios do workflow
        run: |
          echo "== ELEMENTOS OBRIGATÓRIOS == "
          echo "1. name: Nome do workflow"
          echo "2. on: Evento que dispara o workflow"
          echo "3. jobs: Trabalhos a serem executados"
          echo "4. runs-on: Ambiente onde o job será executado"
          echo "5. steps: Passos individuais dentro de um job"
          echo ""
          echo "Total de elementos obrigatórios"

      - name: Variaveis e contexto
        run: |
          echo "== ELEMENTOS OBRIGATÓRIOS == "
          echo "1. env: Variaveis de ambiente"
          echo "2. contextos: Acesso a informação do workflow, job, runner, etc"
          echo ""
          echo "Total de variáveis e contextos: 2"
          